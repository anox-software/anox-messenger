name: anoX V1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Frozen S1 toolchain contract — must match crypto/rust/rust-toolchain.toml
  # and tools/security/native_build.py.
  ANOX_RUST_CHANNEL: "1.97.1"
  ANOX_NDK_VERSION: "r26c"
  ANOX_CARGO_NDK_VERSION: "4.1.2"
  ANOX_CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  supply-chain-policy:
    name: B-017-Lite supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate B-017-Lite supply-chain policy
        run: python3 tools/security/b017_lite_policy_validator.py

      - name: Validate CI pipeline structure (S1 provenance gates present)
        run: python3 tools/security/validate_ci_pipeline.py

      - name: Validate S1 build-provenance repository surface (static)
        run: python3 tools/audit/validate_s1_build_provenance.py --check static

      - name: Secret scan (tracked files)
        run: python3 tools/security/secret_scan.py

      - name: B-021 verification matrix integrity gate (MSC-038)
        run: python3 tools/audit/validate_b021_verification_matrix.py --check integrity

      - name: Set up Rust (pinned) for advisory scan
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"

      - name: Install cargo-audit (pinned)
        run: cargo install cargo-audit --locked --version "${ANOX_CARGO_AUDIT_VERSION}"

      - name: Rust advisory scan (fail-closed)
        working-directory: crypto/rust
        run: cargo audit

  gradle-wrapper-validation:
    name: Gradle wrapper JAR validation
    runs-on: ubuntu-latest
    needs: supply-chain-policy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  rust:
    name: Rust crypto tests
    runs-on: ubuntu-latest
    needs: supply-chain-policy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust (pinned channel + Android targets)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
          targets: "aarch64-linux-android,x86_64-linux-android"

      - name: Assert pinned toolchain from rust-toolchain.toml
        working-directory: crypto/rust
        run: |
          set -euo pipefail
          WANT=$(grep -E '^\s*channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          GOT=$(rustc --version | awk '{print $2}')
          echo "pinned channel: ${WANT}; active rustc: ${GOT}"
          test "${WANT}" = "${ANOX_RUST_CHANNEL}"
          test "${GOT}" = "${WANT}"

      - name: Run Rust tests
        working-directory: crypto/rust
        run: cargo test --locked

  native-build:
    name: Authoritative native build + provenance manifest
    runs-on: ubuntu-latest
    needs:
      - rust
      - gradle-wrapper-validation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust (pinned channel + Android targets)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
          targets: "aarch64-linux-android,x86_64-linux-android"

      - name: Set up NDK r26c
        id: setup_ndk
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r26c
          link-to-sdk: true
          local-cache: true

      - name: Pin authoritative NDK path
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=${{ steps.setup_ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup_ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk (pinned)
        run: cargo install cargo-ndk --locked --version "${ANOX_CARGO_NDK_VERSION}"

      - name: Assert pinned native toolchain
        run: python3 tools/security/native_build.py check-toolchain

      - name: Build native artifacts (authoritative path)
        run: >-
          python3 tools/security/native_build.py build
          --build-id "gha-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Reproducibility check (two clean builds, hash compare)
        run: python3 tools/security/native_build.py rebuild-compare

      - name: Verify artifacts vs manifest (hashes, ABI set, JNI parity)
        run: python3 tools/security/native_build.py verify

      - name: Upload native artifact manifest + libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-artifacts-${{ github.sha }}
          path: |
            build/native/jniLibs/
            build/native/native-manifest.json
          if-no-files-found: error

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    needs:
      - native-build
      - gradle-wrapper-validation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform and build-tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up NDK r26c
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r26c
          link-to-sdk: true
          local-cache: true

      - name: Download authoritative native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-artifacts-${{ github.sha }}
          path: build/native

      - name: Re-verify downloaded artifacts vs manifest
        run: python3 tools/security/native_build.py verify

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :android:testDebugUnitTest

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unit-test-report
          path: android/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Android lint (errors fatal)
        run: ./gradlew --no-daemon :android:lintDebug

      - name: Assemble debug
        run: ./gradlew --no-daemon :android:assembleDebug

      - name: Validate debug APK contents + native hash binding
        run: |
          set -euo pipefail
          APK=$(find android -path '*/debug/*.apk' -type f -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: no debug APK found"
            exit 1
          fi
          echo "Validating $APK"
          python3 tools/security/validate_apk_contents.py "$APK" \
            --native-manifest build/native/native-manifest.json

  android-release:
    name: Android release compile smoke
    runs-on: ubuntu-latest
    needs:
      - native-build
      - android-debug
      - gradle-wrapper-validation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform and build-tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up NDK r26c
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r26c
          link-to-sdk: true
          local-cache: true

      - name: Download authoritative native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-artifacts-${{ github.sha }}
          path: build/native

      - name: Re-verify downloaded artifacts vs manifest
        run: python3 tools/security/native_build.py verify

      - name: Assemble release
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Validate release APK contents + native hash binding
        run: |
          set -euo pipefail
          APK=$(find android -path '*/release/*.apk' -type f -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: no release APK found"
            exit 1
          fi
          echo "Validating $APK"
          python3 tools/security/validate_apk_contents.py "$APK" \
            --native-manifest build/native/native-manifest.json

  instrumented-x86_64:
    name: Instrumented tests on x86_64 emulator (S1 artifact)
    runs-on: ubuntu-latest
    needs:
      - native-build
      - android-debug
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools emulator'

      - name: Install SDK platform, build-tools and x86_64 system image
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" \
            "system-images;android-34;google_apis;x86_64"

      - name: Set up NDK r26c
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r26c
          link-to-sdk: true
          local-cache: true

      - name: Download authoritative native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-artifacts-${{ github.sha }}
          path: build/native

      - name: Re-verify downloaded artifacts vs manifest
        run: python3 tools/security/native_build.py verify

      - name: Enable KVM + create x86_64 AVD
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm || true
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          AVDMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          [ -x "$AVDMGR" ] || AVDMGR="$(command -v avdmanager)"
          echo "no" | "$AVDMGR" create avd --force \
            -n anox_x86_64 \
            -k "system-images;android-34;google_apis;x86_64" \
            --device "pixel_6"

      - name: Boot x86_64 emulator and wait (bounded)
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd anox_x86_64 \
            -no-window -no-audio -no-snapshot-save -accel on \
            -gpu swiftshader_indirect &
          EMULATOR_PID=$!
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          for i in $(seq 1 120); do
            if "$ADB" get-state >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: emulator process exited before ADB became available"
              "$ADB" devices -l || true
              exit 1
            fi
            if [ "$i" = "120" ]; then
              echo "ERROR: emulator did not become available through ADB within 10 minutes"
              "$ADB" devices -l || true
              exit 1
            fi
            sleep 5
          done

          for i in $(seq 1 120); do
            if [ "$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            if [ "$i" = "120" ]; then echo "ERROR: emulator did not boot"; exit 1; fi
            sleep 5
          done
          "$ANDROID_SDK_ROOT/platform-tools/adb" shell settings put global window_animation_scale 0
          "$ANDROID_SDK_ROOT/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$ANDROID_SDK_ROOT/platform-tools/adb" shell settings put global animator_duration_scale 0

      - name: Run instrumented tests (x86_64 produced artifact)
        run: ./gradlew --no-daemon :android:connectedDebugAndroidTest

      - name: Verify tested APK is bound to the manifest
        run: |
          set -euo pipefail
          APK=$(find android -path '*/debug/*.apk' -type f -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: no debug APK found"
            exit 1
          fi
          python3 tools/security/validate_apk_contents.py "$APK" \
            --native-manifest build/native/native-manifest.json

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-x86_64-report
          path: android/build/reports/androidTests/connected
          if-no-files-found: ignore

  instrumented-arm64:
    name: ARM64 runtime / infrastructure disposition
    # GitHub-hosted Apple Silicon runner (public repository): the arm64 system
    # image runs natively via Hypervisor.framework. No self-hosted runner.
    # Hosted macOS runners can lack nested virtualization entirely (observed:
    # "HVF error: HV_UNSUPPORTED" / "failed to initialize HVF"), so an explicit
    # capability probe selects one of exactly two lawful outcomes: the real
    # emulator runtime path executes (available), or the job records a truthful
    # infrastructure disposition (unavailable) — never a fabricated pass.
    runs-on: macos-latest
    needs:
      - native-build
      - android-debug
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools emulator'

      # Explicit capability check BEFORE any emulator step. Exactly two lawful
      # outcomes: virtualization=available runs the real runtime path;
      # virtualization=unavailable records a truthful infrastructure
      # disposition. Neither is decided by test results — only by this probe.
      - name: Probe macOS ARM64 virtualization capability (HVF)
        id: arm64_virt
        run: |
          set -euo pipefail
          echo "probe.runner_os=$RUNNER_OS"
          echo "probe.runner_arch=$RUNNER_ARCH"
          echo "probe.runner_image=${ImageOS:-unknown}"
          echo "probe.host_uname=$(uname -srm)"
          HV=missing
          if sysctl -n kern.hv_support >/dev/null 2>&1; then
            HV=$(sysctl -n kern.hv_support)
          fi
          echo "probe.kern_hv_support=$HV"
          ACCEL=none
          if [ -x "$ANDROID_SDK_ROOT/emulator/emulator" ]; then
            if $ANDROID_SDK_ROOT/emulator/emulator -accel-check > "$RUNNER_TEMP/arm64-accel-check.log" 2>&1; then
              ACCEL=checked-no-hvf
              if grep -qi hvf "$RUNNER_TEMP/arm64-accel-check.log"; then
                ACCEL=hvf
              fi
            fi
            sed -n '1,40p' "$RUNNER_TEMP/arm64-accel-check.log"
          fi
          echo "probe.accel_check=$ACCEL"
          VIRT=unavailable
          if [ "$RUNNER_ARCH" = "ARM64" ] && [ "$(uname -m)" = "arm64" ] && [ "$HV" = "1" ] && [ "$ACCEL" = "hvf" ]; then
            VIRT=available
          fi
          echo "probe.result=$VIRT"
          echo virtualization=$VIRT >> $GITHUB_OUTPUT

      - name: Install SDK platform, build-tools and arm64 system image
        if: steps.arm64_virt.outputs.virtualization == 'available'
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" \
            "system-images;android-34;google_apis;arm64-v8a"

      - name: Set up NDK r26c
        if: steps.arm64_virt.outputs.virtualization == 'available'
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r26c
          link-to-sdk: true
          local-cache: true

      - name: Download authoritative native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-artifacts-${{ github.sha }}
          path: build/native

      - name: Re-verify downloaded artifacts vs manifest
        run: python3 tools/security/native_build.py verify

      - name: Sanitize stale emulators
        if: steps.arm64_virt.outputs.virtualization == 'available'
        run: |
          set -euo pipefail
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          # An emulator left over from a previous run would join this run's
          # device set and split the instrumented install across devices.
          # Kill every emulator-* device (physical/non-emulator devices are
          # never touched), then require a clean emulator state before this
          # run's AVD is created.
          for dev in $("$ADB" devices | awk '/^emulator-/ {print $1}'); do
            echo "killing stale emulator device: $dev"
            "$ADB" -s "$dev" emu kill
          done
          remaining=""
          for i in $(seq 1 30); do
            remaining=$("$ADB" devices | awk '/^emulator-/ {print $1}')
            [ -z "$remaining" ] && break
            sleep 2
          done
          if [ -n "$remaining" ]; then
            echo "ERROR: stale emulator devices still present after bounded wait: $remaining"
            "$ADB" devices -l
            exit 1
          fi
          "$ADB" devices -l

      - name: Create arm64 AVD
        if: steps.arm64_virt.outputs.virtualization == 'available'
        run: |
          set -euo pipefail
          AVDMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          [ -x "$AVDMGR" ] || AVDMGR="$(command -v avdmanager)"
          echo "no" | "$AVDMGR" create avd --force \
            -n anox_arm64 \
            -k "system-images;android-34;google_apis;arm64-v8a" \
            --device "pixel_6"

      - name: Boot arm64 emulator and wait (bounded)
        if: steps.arm64_virt.outputs.virtualization == 'available'
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd anox_arm64 \
            -no-window -no-audio -no-snapshot-save \
            -gpu swiftshader_indirect &
          EMULATOR_PID=$!
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          for i in $(seq 1 120); do
            if "$ADB" get-state >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: emulator process exited before ADB became available"
              "$ADB" devices -l || true
              exit 1
            fi
            if [ "$i" = "120" ]; then
              echo "ERROR: emulator did not become available through ADB within 10 minutes"
              "$ADB" devices -l || true
              exit 1
            fi
            sleep 5
          done

          for i in $(seq 1 120); do
            if [ "$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            if [ "$i" = "120" ]; then echo "ERROR: emulator did not boot"; exit 1; fi
            sleep 5
          done
          "$ANDROID_SDK_ROOT/platform-tools/adb" shell settings put global window_animation_scale 0
          "$ANDROID_SDK_ROOT/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$ANDROID_SDK_ROOT/platform-tools/adb" shell settings put global animator_duration_scale 0
          # Exactly one online emulator must be visible: the AVD created by
          # this run. Zero or more than one means the device set is
          # contaminated and the instrumented install is not deterministic —
          # fail closed.
          count=$("$ANDROID_SDK_ROOT/platform-tools/adb" devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ {n++} END {print n+0}')
          if [ "$count" != "1" ]; then
            echo "ERROR: expected exactly 1 online emulator device after boot, found $count"
            "$ANDROID_SDK_ROOT/platform-tools/adb" devices -l
            exit 1
          fi

      - name: Run instrumented tests (arm64-v8a produced artifact)
        if: steps.arm64_virt.outputs.virtualization == 'available'
        run: ./gradlew --no-daemon :android:connectedDebugAndroidTest

      - name: Verify tested APK is bound to the manifest
        if: steps.arm64_virt.outputs.virtualization == 'available'
        run: |
          set -euo pipefail
          APK=$(find android -path '*/debug/*.apk' -type f -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: no debug APK found"
            exit 1
          fi
          python3 tools/security/validate_apk_contents.py "$APK" \
            --native-manifest build/native/native-manifest.json

      # Runs only when the runtime path really executed (implicit success()).
      - name: Record ARM64 runtime disposition (runtime executed)
        if: steps.arm64_virt.outputs.virtualization == 'available'
        run: |
          set -euo pipefail
          echo "ARM64_RUNTIME_STATUS=PASS"
          echo "RUNTIME_EXECUTED_AND_PASS: the arm64 instrumented runtime path executed and passed on a virtualization-capable hosted runner"
          {
            echo "### ARM64 runtime / infrastructure disposition"
            echo ""
            echo "- ARM64_RUNTIME_STATUS=PASS"
            echo "- RUNTIME_EXECUTED_AND_PASS"
            echo "- runner: $RUNNER_OS / ${ImageOS:-unknown} / $RUNNER_ARCH / $(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs only when the probe proved the hosted nested-virtualization
      # limitation. A successful disposition gate — NOT runtime verification.
      - name: Record ARM64 runtime disposition (infrastructure blocked)
        if: steps.arm64_virt.outputs.virtualization == 'unavailable'
        run: |
          set -euo pipefail
          echo "ARM64_RUNTIME_STATUS=INFRASTRUCTURE_BLOCKED_GITHUB_HOSTED_NESTED_VIRTUALIZATION"
          echo "RUNTIME_NOT_EXECUTED_INFRASTRUCTURE_BLOCKED"
          echo "runner_os=$RUNNER_OS"
          echo "runner_image=${ImageOS:-unknown}"
          echo "runner_arch=$RUNNER_ARCH"
          echo "host_uname=$(uname -m)"
          echo "hvf_capability=unavailable (kern.hv_support / -accel-check probe)"
          echo "disposition=GitHub-hosted macOS ARM64 nested virtualization limitation — NOT a runtime pass"
          {
            echo "### ARM64 runtime / infrastructure disposition"
            echo ""
            echo "- ARM64_RUNTIME_STATUS=INFRASTRUCTURE_BLOCKED_GITHUB_HOSTED_NESTED_VIRTUALIZATION"
            echo "- RUNTIME_NOT_EXECUTED_INFRASTRUCTURE_BLOCKED"
            echo "- runner: $RUNNER_OS / ${ImageOS:-unknown} / $RUNNER_ARCH / $(uname -m)"
            echo "- capability: macOS HVF nested virtualization unavailable on this hosted runner"
            echo "- truth: this is a successful disposition gate, NOT runtime verification"
            echo "- deferred: REAL_ARM64_RUNTIME_EVIDENCE required before the final security / pre-product acceptance gate"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-arm64-report
          path: android/build/reports/androidTests/connected
          if-no-files-found: ignore
