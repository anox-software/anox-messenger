name: anoX V1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  supply-chain-policy:
    name: B-017-Lite supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate B-017-Lite supply-chain policy
        run: python3 tools/security/b017_lite_policy_validator.py

  gradle-wrapper-validation:
    name: Gradle wrapper JAR validation
    runs-on: ubuntu-latest
    needs: supply-chain-policy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  rust:
    name: Rust crypto tests
    runs-on: ubuntu-latest
    needs: supply-chain-policy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run Rust tests
        working-directory: crypto/rust
        run: cargo test --locked

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    needs:
      - rust
      - gradle-wrapper-validation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'tools platform-tools'

      - name: Install Android SDK platform and build-tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up NDK r26c
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r26c
          link-to-sdk: true
          local-cache: true

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :android:testDebugUnitTest

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unit-test-report
          path: android/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Assemble debug
        run: ./gradlew --no-daemon :android:assembleDebug

      - name: Validate debug APK contents
        run: |
          set -euo pipefail
          APK=$(find android -path '*/debug/*.apk' -type f -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: no debug APK found"
            exit 1
          fi
          echo "Validating $APK"
          python3 tools/security/validate_apk_contents.py "$APK"

  android-release:
    name: Android release compile smoke
    runs-on: ubuntu-latest
    needs:
      - android-debug
      - gradle-wrapper-validation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'tools platform-tools'

      - name: Install Android SDK platform and build-tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up NDK r26c
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r26c
          link-to-sdk: true
          local-cache: true

      - name: Assemble release
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Validate release APK contents
        run: |
          set -euo pipefail
          APK=$(find android -path '*/release/*.apk' -type f -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: no release APK found"
            exit 1
          fi
          echo "Validating $APK"
          python3 tools/security/validate_apk_contents.py "$APK"
