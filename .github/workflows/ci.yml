name: anoX V1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust:
    name: Rust crypto tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        working-directory: crypto/rust
        run: cargo test

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'tools platform-tools'

      - name: Install Android SDK platform and build-tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up NDK r26c
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r26c
          link-to-sdk: true
          local-cache: true

      - name: Assemble debug
        run: ./gradlew --no-daemon :android:assembleDebug

      - name: Validate debug APK contents
        run: |
          APK=$(find android -path '*/debug/*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: no debug APK found"
            exit 1
          fi
          echo "Validating $APK"
          python3 tools/security/validate_apk_contents.py "$APK"

  android-release:
    name: Android release compile smoke
    runs-on: ubuntu-latest
    needs: android-debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'tools platform-tools'

      - name: Install Android SDK platform and build-tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up NDK r26c
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r26c
          link-to-sdk: true
          local-cache: true

      - name: Assemble release
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Validate release APK contents
        run: |
          APK=$(find android -path '*/release/*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: no release APK found"
            exit 1
          fi
          echo "Validating $APK"
          python3 tools/security/validate_apk_contents.py "$APK"
