[package]
name = "anox_crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zeroize = "1.8"
aes-gcm = "0.10.3"
getrandom = "0.2"
jni = "0.21.1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"